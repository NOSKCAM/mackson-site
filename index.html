<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mackson Technology</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#020617;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* LOADING */

#loader{
position:fixed;
width:100%;
height:100%;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.spinner{
width:45px;
height:45px;
border:4px solid rgba(255,255,255,0.1);
border-top:4px solid #3b82f6;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

.container{

position:relative;
z-index:2;
width:90%;
max-width:380px;
padding:30px 20px;
border-radius:20px;
text-align:center;

backdrop-filter:blur(20px);
background:rgba(15,23,42,0.6);

border:1px solid rgba(59,130,246,0.2);
box-shadow:0 0 50px rgba(59,130,246,0.2);

transition:transform 0.4s ease, opacity 0.4s ease;

}

/* animação saída */

.container.exit{
opacity:0;
transform:scale(0.9) translateY(40px);
}

.logo{
width:150px;
margin-bottom:10px;
filter:drop-shadow(0 0 20px #3b82f6);
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}

h1{
font-size:24px;
}

p{
font-size:14px;
color:#94a3b8;
margin-bottom:25px;
}

.links{
display:flex;
flex-direction:column;
gap:14px;
}

.link{

padding:16px;
border-radius:14px;
text-decoration:none;
color:white;
font-weight:600;

display:flex;
align-items:center;
justify-content:center;
gap:10px;

background:linear-gradient(145deg,rgba(15,23,42,0.9),rgba(30,41,59,0.6));

border:1px solid rgba(59,130,246,0.2);

transition:0.25s;
}

.link:hover{
transform:translateY(-3px) scale(1.03);
}

.link:active{
transform:scale(0.95);
}

.footer{
margin-top:20px;
font-size:12px;
color:#64748b;
}

</style>
</head>

<body>

<div id="loader">
<div class="spinner"></div>
</div>

<canvas id="bg"></canvas>

<div class="container" id="card">

<img class="logo" src="logo.png">

<h1>Mackson Technology</h1>
<p>Assistência técnica em celular e PC</p>

<div class="links">

<a class="link" href="https://wa.me/5587981750054?text=Olá,%20quero%20um%20orçamento" target="_blank">
📱 WhatsApp
</a>

<a class="link" href="https://instagram.com/mackson.technology" target="_blank">
📸 Instagram
</a>

<a class="link" href="https://www.instagram.com/s/aGlnaGxpZ2h0OjE4MDg4ODYyMjAxMTM3MTgy?igsh=MXFyZXgzejl5enRzbg==" target="_blank">
✔️ Serviços Finalizados
</a>

</div>

<div class="footer">
© 2026 Mackson Technology
</div>

</div>

<audio id="clickSound">
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3">
</audio>

<script>

/* LOADING */

window.onload = ()=>{
setTimeout(()=>{
document.getElementById("loader").style.display="none"
},800)
}

/* SOM */

const click = document.getElementById("clickSound")

/* TRANSIÇÃO DE PÁGINA */

document.querySelectorAll(".link").forEach(btn=>{

btn.addEventListener("click",(e)=>{

e.preventDefault()

click.currentTime=0
click.play()

let url = btn.href

const card = document.getElementById("card")

card.classList.add("exit")

setTimeout(()=>{
window.location=url
},400)

})

})

/* PARTICLES */

const canvas = document.getElementById("bg")
const ctx = canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let particles=[]

for(let i=0;i<70;i++){

particles.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
dx:(Math.random()-0.5),
dy:(Math.random()-0.5)

})

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

particles.forEach(p=>{

p.x+=p.dx
p.y+=p.dy

if(p.x<0||p.x>canvas.width)p.dx*=-1
if(p.y<0||p.y>canvas.height)p.dy*=-1

ctx.beginPath()
ctx.arc(p.x,p.y,p.r,0,Math.PI*2)
ctx.fillStyle="#3b82f6"
ctx.fill()

})

requestAnimationFrame(animate)

}

animate()

/* SWIPE GESTURE */

let startX=0
let startY=0

document.addEventListener("touchstart",(e)=>{

startX=e.touches[0].clientX
startY=e.touches[0].clientY

})

document.addEventListener("touchend",(e)=>{

let endX=e.changedTouches[0].clientX
let endY=e.changedTouches[0].clientY

let diffX=endX-startX
let diffY=endY-startY

const card=document.getElementById("card")

if(Math.abs(diffX)>80){

card.style.transform=`rotateY(${diffX/5}deg)`

}

if(Math.abs(diffY)>80){

card.style.transform=`rotateX(${-diffY/5}deg)`

}

})

</script>

</body>
</html>
